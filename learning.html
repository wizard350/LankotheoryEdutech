<title>Learning | LANKOTHEORY</title>

<link

<link

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Roboto", sans-serif;
        background: #f5f7fb;
        color: #172033;
        min-height: 100vh;
    }

    .learning-header {
        background: #1e3a8a;
        color: white;
        padding: 18px 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .learning-brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .learning-brand i {
        font-size: 28px;
    }

    .learning-brand strong {
        font-size: 20px;
    }

    .learning-back {
        color: white;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,.35);
        padding: 10px 16px;
        border-radius: 10px;
    }

    .learning-container {
        width: min(1000px, 92%);
        margin: 35px auto;
    }

    .lesson-top {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .lesson-label {
        color: #2563eb;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .lesson-top h1 {
        margin: 10px 0;
        font-size: clamp(28px, 5vw, 42px);
    }

    .lesson-top p {
        color: #64748b;
    }

    .lesson-progress-box {
        margin-top: 25px;
    }

    .lesson-progress-bar {
        height: 12px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
    }

    .lesson-progress-fill {
        height: 100%;
        background: #2563eb;
        width: 0;
        transition: width .4s ease;
    }

    .lesson-progress-text {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: #64748b;
        font-size: 14px;
    }

    .lesson-card {
        background: white;
        border-radius: 20px;
        padding: 35px;
        margin-top: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .lesson-card h2 {
        font-size: 28px;
        margin-bottom: 20px;
    }

    .lesson-points {
        display: grid;
        gap: 15px;
        margin-bottom: 30px;
    }

    .lesson-point {
        background: #eff6ff;
        border-left: 5px solid #2563eb;
        padding: 18px;
        border-radius: 10px;
        line-height: 1.6;
    }

    .quiz-box {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid #e5e7eb;
    }

    .quiz-question {
        margin-bottom: 25px;
    }

    .quiz-question h3 {
        margin-bottom: 15px;
        font-size: 19px;
    }

    .quiz-option {
        width: 100%;
        text-align: left;
        padding: 15px 18px;
        border: 2px solid #e5e7eb;
        background: white;
        border-radius: 12px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 16px;
        transition: .2s;
    }

    .quiz-option:hover {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .quiz-option.selected {
        border-color: #2563eb;
        background: #dbeafe;
    }

    .quiz-result {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        display: none;
        font-weight: 600;
    }

    .quiz-result.show {
        display: block;
    }

    .quiz-result.success {
        background: #dcfce7;
        color: #166534;
    }

    .quiz-result.fail {
        background: #fee2e2;
        color: #991b1b;
    }

    .lesson-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .lesson-button {
        border: none;
        background: #2563eb;
        color: white;
        padding: 14px 20px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
    }

    .lesson-button.secondary {
        background: #e2e8f0;
        color: #172033;
    }

    .xp-box {
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        color: white;
        border-radius: 18px;
        padding: 22px;
        margin-top: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }

    .xp-box strong {
        font-size: 28px;
    }

    .complete-message {
        text-align: center;
        padding: 40px 20px;
        display: none;
    }

    .complete-message.show {
        display: block;
    }

    .complete-message i {
        font-size: 60px;
        color: #16a34a;
        margin-bottom: 15px;
    }

    @media (max-width: 600px) {

        .learning-header {
            padding: 15px 4%;
        }

        .learning-container {
            width: 94%;
            margin: 20px auto;
        }

        .lesson-top,
        .lesson-card {
            padding: 22px;
        }

    }

</style>
```

<body>

```
<header class="learning-header">

    <div class="learning-brand">

        <i class="fa-solid fa-graduation-cap"></i>

        <strong>
            LANKOTHEORY
        </strong>

    </div>

    <a
        href="dashboard.html"
        class="learning-back"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Dashboard
    </a>

</header>


<main class="learning-container">

    <section class="lesson-top">

        <span
            class="lesson-label"
            id="programName"
        >
            COURSE
        </span>

        <h1 id="courseName">
            Loading...
        </h1>

        <p id="courseDescription">
            Your learning journey starts here.
        </p>

        <div class="lesson-progress-box">

            <div class="lesson-progress-bar">

                <div
                    class="lesson-progress-fill"
                    id="courseProgressFill"
                ></div>

            </div>

            <div class="lesson-progress-text">

                <span id="courseProgressText">
                    0% complete
                </span>

                <span id="lessonCounter">
                    Lesson 1
                </span>

            </div>

        </div>

    </section>


    <section class="lesson-card">

        <h2 id="lessonTitle">
            Loading lesson...
        </h2>

        <div
            class="lesson-points"
            id="lessonPoints"
        ></div>


        <div class="quiz-box">

            <h2>
                Quick Quiz
            </h2>

            <div id="quizContainer"></div>

            <button
                type="button"
                class="lesson-button"
                id="submitQuiz"
            >
                Check Answers
            </button>

            <div
                class="quiz-result"
                id="quizResult"
            ></div>

        </div>


        <div class="lesson-actions">

            <button
                type="button"
                class="lesson-button secondary"
                id="previousLesson"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Previous
            </button>

            <button
                type="button"
                class="lesson-button"
                id="nextLesson"
            >
                Next Lesson
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>

        <div
            class="complete-message"
            id="completeMessage"
        >

            <i class="fa-solid fa-circle-check"></i>

            <h2>
                Lesson Completed!
            </h2>

            <p>
                Great work! Your progress has been updated.
            </p>

        </div>

    </section>


    <div class="xp-box">

        <div>

            <span>
                Your XP
            </span>

            <div>
                <strong id="studentXP">
                    0
                </strong>
                XP
            </div>

        </div>

        <i class="fa-solid fa-bolt"></i>

    </div>

</main>


<script src="js/learning.js"></script>

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const savedStudent =
                localStorage.getItem(
                    "lankotheoryCurrentUser"
                );

            if (!savedStudent) {

                window.location.href =
                    "login.html";

                return;

            }

            const student =
                JSON.parse(savedStudent);

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const program =
                params.get("program") ||
                student.program;

            const course =
                params.get("course");

            if (
                !courseData[program] ||
                !courseData[program][course]
            ) {

                window.location.href =
                    "dashboard.html";

                return;

            }

            const lessons =
                courseData[program][course];

            let currentLesson =
                0;

            const progress =
                getLearningProgress();

            const courseId =
                `${program}__${course}`;

            const completed =
                progress[courseId]?.completed || [];


            const firstIncomplete =
                lessons.findIndex(
                    function (_, index) {

                        return !completed.includes(
                            index
                        );

                    }
                );


            if (firstIncomplete >= 0) {

                currentLesson =
                    firstIncomplete;

            } else {

                currentLesson =
                    lessons.length - 1;

            }


            const programName =
                document.getElementById(
                    "programName"
                );

            const courseName =
                document.getElementById(
                    "courseName"
                );

            const lessonTitle =
                document.getElementById(
                    "lessonTitle"
                );

            const lessonPoints =
                document.getElementById(
                    "lessonPoints"
                );

            const quizContainer =
                document.getElementById(
                    "quizContainer"
                );

            const quizResult =
                document.getElementById(
                    "quizResult"
                );

            const courseProgressFill =
                document.getElementById(
                    "courseProgressFill"
                );

            const courseProgressText =
                document.getElementById(
                    "courseProgressText"
                );

            const lessonCounter =
                document.getElementById(
                    "lessonCounter"
                );

            const studentXP =
                document.getElementById(
                    "studentXP"
                );

            const completeMessage =
                document.getElementById(
                    "completeMessage"
                );


            programName.textContent =
                program;

            courseName.textContent =
                course;


            function renderLesson() {

                const lesson =
                    lessons[currentLesson];

                lessonTitle.textContent =
                    lesson.title;

                lessonPoints.innerHTML = "";

                lesson.lessons.forEach(
                    function (point) {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "lesson-point";

                        div.innerHTML = `
                            <i class="fa-solid fa-circle-check"></i>
                            ${point}
                        `;

                        lessonPoints.appendChild(
                            div
                        );

                    }
                );


                quizContainer.innerHTML = "";

                lesson.quiz.forEach(
                    function (question, qIndex) {

                        const box =
                            document.createElement(
                                "div"
                            );

                        box.className =
                            "quiz-question";

                        let html = `
                            <h3>
                                ${qIndex + 1}.
                                ${question.question}
                            </h3>
                        `;


                        question.options.forEach(
                            function (
                                option,
                                optionIndex
                            ) {

                                html += `

                                    <button
                                        type="button"
                                        class="quiz-option"
                                        data-question="${qIndex}"
                                        data-option="${optionIndex}"
                                    >
                                        ${option}
                                    </button>

                                `;

                            }
                        );


                        box.innerHTML =
                            html;

                        quizContainer.appendChild(
                            box
                        );

                    }
                );


                document
                    .querySelectorAll(
                        ".quiz-option"
                    )
                    .forEach(
                        function (button) {

                            button.addEventListener(
                                "click",
                                function () {

                                    const question =
                                        this.dataset.question;

                                    document
                                        .querySelectorAll(
                                            `.quiz-option[data-question="${question}"]`
                                        )
                                        .forEach(
                                            function (item) {

                                                item.classList.remove(
                                                    "selected"
                                                );

                                            }
                                        );

                                    this.classList.add(
                                        "selected"
                                    );

                                }
                            );

                        }
                    );


                quizResult.className =
                    "quiz-result";

                quizResult.textContent =
                    "";

                completeMessage.classList.remove(
                    "show"
                );


                const currentProgress =
                    getCourseProgress(
                        program,
                        course
                    );

                courseProgressFill.style.width =
                    `${currentProgress}%`;

                courseProgressText.textContent =
                    `${currentProgress}% complete`;

                lessonCounter.textContent =
                    `Lesson ${currentLesson + 1} of ${lessons.length}`;

                studentXP.textContent =
                    getStudentXP();


                document.getElementById(
                    "previousLesson"
                ).disabled =
                    currentLesson === 0;

            }


            document.getElementById(
                "submitQuiz"
            ).addEventListener(
                "click",
                function () {

                    const lesson =
                        lessons[currentLesson];

                    let correct =
                        0;

                    lesson.quiz.forEach(
                        function (
                            question,
                            qIndex
                        ) {

                            const selected =
                                document.querySelector(
                                    `.quiz-option.selected[data-question="${qIndex}"]`
                                );

                            if (
                                selected &&
                                Number(
                                    selected.dataset.option
                                ) === question.answer
                            ) {

                                correct++;

                            }

                        }
                    );


                    const percentage =
                        Math.round(
                            (correct / lesson.quiz.length) *
                            100
                        );


                    if (
                        percentage >= 70
                    ) {

                        quizResult.className =
                            "quiz-result show success";

                        quizResult.innerHTML = `
                            🎉 Excellent!
                            You scored ${percentage}%.
                            +${lesson.xp} XP earned.
                        `;


                        markLessonComplete(
                            program,
                            course,
                            currentLesson,
                            lesson.xp
                        );


                        completeMessage.classList.add(
                            "show"
                        );


                        courseProgressFill.style.width =
                            `${getCourseProgress(program, course)}%`;

                        courseProgressText.textContent =
                            `${getCourseProgress(program, course)}% complete`;

                        studentXP.textContent =
                            getStudentXP();


                        if (
                            currentLesson ===
                            lessons.length - 1
                        ) {

                            document.getElementById(
                                "nextLesson"
                            ).innerHTML = `
                                Finish Course
                                <i class="fa-solid fa-check"></i>
                            `;

                        }

                    } else {

                        quizResult.className =
                            "quiz-result show fail";

                        quizResult.innerHTML = `
                            You scored ${percentage}%.
                            You need at least 70% to
                            complete this lesson.
                            Review the lesson and try again.
                        `;

                    }

                }
            );


            document.getElementById(
                "nextLesson"
            ).addEventListener(
                "click",
                function () {

                    const progressNow =
                        getLearningProgress();

                    const completedNow =
                        progressNow[courseId]?.completed || [];

                    if (
                        !completedNow.includes(
                            currentLesson
                        )
                    ) {

                        alert(
                            "Complete the quiz with at least 70% before moving to the next lesson."
                        );

                        return;

                    }


                    if (
                        currentLesson <
                        lessons.length - 1
                    ) {

                        currentLesson++;

                        renderLesson();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    } else {

                        window.location.href =
                            "dashboard.html";

                    }

                }
            );


            document.getElementById(
                "previousLesson"
            ).addEventListener(
                "click",
                function () {

                    if (
                        currentLesson > 0
                    ) {

                        currentLesson--;

                        renderLesson();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }

                }
            );


            renderLesson();

        }
    );

</script>
